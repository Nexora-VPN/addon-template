name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build ./...
      - name: the manifest is one a panel accepts
        run: go run github.com/nexora-vpn/addon-kit/cmd/nexora-addon check nexora-addon.json
      - run: sh -n install.sh
